---
- name: Share Drupal database configuration
  hosts: drupal_app
  become: true
  gather_facts: false

  tasks:
    - name: Read Drupal settings from first server
      ansible.builtin.slurp:
        src: /var/www/drupal/web/sites/default/settings.php
      register: drupal_settings
      when: inventory_hostname == 'i-069944ff131af1171'

    - name: Copy Drupal settings to second server
      ansible.builtin.copy:
        content: "{{ hostvars['i-069944ff131af1171']['drupal_settings']['content'] | b64decode }}"
        dest: /var/www/drupal/web/sites/default/settings.php
        owner: www-data
        group: www-data
        mode: '0444'
      when: inventory_hostname == 'i-0a30fa54582d2a829'
      no_log: true
